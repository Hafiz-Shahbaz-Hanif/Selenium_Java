name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run TestNG suite (headless)
        run: ./mvnw -B test

      - name: Upload ExtentReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report
          path: target/extent-report
          retention-days: 7

      - name: Upload TestNG + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-artifacts
          path: |
            target/surefire-reports
            target/screenshots
          retention-days: 7
