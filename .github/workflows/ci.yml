name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  the-internet:
    name: the-internet suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run the the-internet suite (headless)
        run: ./mvnw -B test -Pinternet

      - name: Upload ExtentReports + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-internet
          path: |
            target/extent-report
            target/surefire-reports
            target/screenshots
          retention-days: 7

  parabank:
    name: ParaBank suite (non-blocking)
    runs-on: ubuntu-latest
    # The ParaBank public demo is periodically reset and can be slow/unavailable,
    # so this job informs but does not gate the build.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run the ParaBank suite (headless)
        run: ./mvnw -B test -Pparabank

      - name: Upload ExtentReports + screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-parabank
          path: |
            target/extent-report
            target/surefire-reports
            target/screenshots
          retention-days: 7
